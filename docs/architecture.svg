<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
<title id="title">TradeLoop AWS architecture</title><desc id="desc">Live WhatsApp communication in Mumbai connects to a bounded AI and staff approval workflow in Virginia. Synthetic operational demonstration records.</desc>
